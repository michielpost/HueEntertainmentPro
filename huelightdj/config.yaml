name: Hue Entertainment Pro
version: "1.0.3"
slug: huelightdj
description: >-
  Web app to control multiple Philips Hue bridges, merge their entertainment
  areas into one and apply realtime light effects using the Hue Entertainment API.
url: https://github.com/michielpost/HueEntertainmentPro
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8080
panel_icon: mdi:lightbulb-multiple
stage: experimental
# Pre-built multi-arch image (linux/amd64 + linux/arm64), published by
# .github/workflows/addon.yml. Users pull this image instead of compiling
# .NET on their Home Assistant machine.
# NOTE: no tag here - Supervisor rejects tags in "image" and pulls
# {image}:{version}, so the pushed image tag must match "version" above.
image: ghcr.io/michielpost/huelightdj-addon
# Restart the add-on automatically if the web UI stops responding.
watchdog: http://[HOST]:8080/
options: {}
schema: {}
