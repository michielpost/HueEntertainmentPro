<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HueEntertainmentPro</title>
  <!-- Resolve all relative URLs (assets, gRPC, SignalR, API) against the URL this
       page was loaded from, so the app also works when hosted under a dynamic
       path prefix (e.g. Home Assistant ingress: /api/hassio_ingress/<token>/). -->
  <script>
    (function () {
      var path = window.location.pathname;
      path += path.endsWith('/') ? '' : '/';

      var base = document.querySelector('base');
      if (!base) {
        base = document.createElement('base');
        document.head.appendChild(base);
      }
      base.href = window.location.origin + path;
    })();
  </script>
  <link href="_content/Microsoft.FluentUI.AspNetCore.Components/css/reboot.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="HueEntertainmentPro.Client.styles.css" />
  <style>
    /* Set the default dark mode styles, used before the Fluent UI theme switcher is initialized.
       This avoids a flash of white when in dark mode. */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #292929;
        color: #ffffff;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <svg class="loading-progress">
      <circle r="40%" cx="50%" cy="50%" />
      <circle r="40%" cx="50%" cy="50%" />
    </svg>
    <div class="loading-progress-text"></div>
  </div>

  <div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="" class="reload">Reload</a>
    <a class="dismiss">🗙</a>
  </div>
  <script src="_framework/blazor.webassembly.js"></script>

  <script src="js/pixi.min.js"></script>
  <script src="js/pixi-layers.js"></script>
  <script src="js/preview.js"></script>
</body>

</html>
